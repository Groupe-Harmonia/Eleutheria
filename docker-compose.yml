services:
  app:
    image: ghcr.io/groupe-harmonia/eleutheria:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false

    environment:
      # - ELEUTHERIA_PREPARE_DB=true
      - ELEUTHERIA_APP_URL
      - ELEUTHERIA_APP_EXCEPTION_DETAILS
      - ELEUTHERIA_APP_TURNSTILE_SITE_KEY
      # I wish I could have used a secret instead, but it would have been mandatory for
      # development...
      - ELEUTHERIA_APP_TURNSTILE_SECRET_KEY
      - ELEUTHERIA_LOG_LEVEL=${ELEUTHERIA_LOG_LEVEL:-300}

      # Discord
      - ELEUTHERIA_DISCORD_WEBHOOK_URL

      # SMTP
      - ELEUTHERIA_APP_SMTP_HOST
      - ELEUTHERIA_APP_SMTP_PORT
      - ELEUTHERIA_APP_SMTP_DOMAIN
      - ELEUTHERIA_APP_SMTP_USERNAME
      - ELEUTHERIA_APP_SMTP_PASSWORD

    secrets:
      - app-secret-key
      - app-upgrade-key
      - db-password

    volumes:
      - app_images:/var/www/html/images
      - app_deleted_images:/var/www/data/deleted_images
      - proxy_data:/data
      # Commentez cette ligne pour pouvoir initialiser la base de données en ligne. Puis suivez :
      # https://stackoverflow.com/questions/68267224/how-to-script-initializing-the-mediawiki-database-when-localsettings-php-already
      # Les valeurs qui sont données ne sont pas importantes, sauf utilisatrices et connections à la DB.
    ports:
      - $ELEUTHERIA_PROXY_PORT:80

    healthcheck:
      test: netstat -an | grep :9000
      start_interval: 2s
      start_period: 3s
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      fluent-bit:
        condition: service_started

  db:
    image: mariadb:11.8
    restart: unless-stopped

    environment:
      # @see https://phabricator.wikimedia.org/source/mediawiki/browse/master/includes/DefaultSettings.php
      MYSQL_DATABASE: eleutheria
      MYSQL_USER: app
      MYSQL_PASSWORD: $ELEUTHERIA_DB_PASSWORD
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    secrets:
      - db-password
      - db-ro-password

    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db:/var/lib/mysql
      - ./services/mariadb/init-user.sh:/docker-entrypoint-initdb.d/init-user.sh

    healthcheck:
      test: healthcheck.sh --connect --innodb_initialized
      start_period: 3s
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.4
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    environment:
      LOKI_USERNAME: $ELEUTHERIA_LOKI_USERNAME
      LOKI_PASSWORD: $ELEUTHERIA_LOKI_PASSWORD

    volumes:
      - loki_data:/loki

    healthcheck:
      test: wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q -w ready || exit 1
      start_interval: 2s
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  fluent-bit:
    build:
      context: ./services/fluent-bit
    command: ["-c", "/fluent-bit/etc/fluent-bit.yaml"]
    restart: unless-stopped
    environment:
      LOKI_URL: loki
      LOKI_USERNAME: $ELEUTHERIA_LOKI_USERNAME
      LOKI_PASSWORD: $ELEUTHERIA_LOKI_PASSWORD
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    restart: unless-stopped
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_FEATURE_TOGGLES_ENABLE: alertingSimplifiedRouting,alertingQueryAndExpressionsStepMode
      GF_SERVER_ROOT_URL: "${ELEUTHERIA_GRAFANA_URL:-http://localhost:3000}"
      GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: true

    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  app_images:
  app_deleted_images:
  proxy_data:
  loki_data:
  grafana_data:
  db:

secrets:
  app-secret-key:
    environment: ELEUTHERIA_APP_SECRET_KEY
  app-upgrade-key:
    environment: ELEUTHERIA_APP_UPGRADE_KEY
  db-password:
    environment: ELEUTHERIA_DB_PASSWORD
  db-ro-password:
    environment: ELEUTHERIA_DB_RO_PASSWORD
